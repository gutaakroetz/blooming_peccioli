<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blooming Peccioli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>

  <!-- ── SIDEBAR ─────────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div id="brand">
      <span id="brand-blooming">Blooming</span>
      <span id="brand-peccioli">Peccioli</span>
    </div>

    <nav id="scenario-nav">
      <p class="nav-label">Scenario</p>
      <button class="scenario-btn active" data-scenario="weekday">
        <span class="btn-icon">🗓</span>
        <span>Giorno Feriale</span>
      </button>
      <button class="scenario-btn" data-scenario="weekend">
        <span class="btn-icon">🌿</span>
        <span>Fine Settimana</span>
      </button>
      <button class="scenario-btn" data-scenario="eventday">
        <span class="btn-icon">🎉</span>
        <span>Giornata Evento</span>
      </button>
    </nav>

    <div id="legend">
      <p class="nav-label">Flotta</p>
      <div class="legend-item"><span class="dot" style="background:#6a994e"></span>Peccioli</div>
      <div class="legend-item"><span class="dot" style="background:#e63946"></span>Forcoli</div>
      <div class="legend-item"><span class="dot" style="background:#457b9d"></span>Fabbrica</div>
      <div class="legend-item"><span class="dot" style="background:#2a9d8f"></span>Belvedere</div>
      <div class="legend-item"><span class="dot" style="background:#e9c46a"></span>Rosa</div>
      <div class="legend-item"><span class="dot" style="background:#f4a261"></span>Ghizzano</div>
      <div class="legend-item"><span class="dot jolly-dot-legend"></span>Jolly</div>
    </div>

    <div id="stats-section">
      <p class="nav-label">Km percorsi</p>
      <div id="km-bars"><!-- popolato da JS --></div>
      <div id="users-row">
        <p class="nav-label" style="margin-top:10px">Utenti potenziali</p>
        <div class="users-bar-row">
          <div class="users-bar-track"><div id="users-bar"></div></div>
          <span id="users-val">0</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ── MAPPA ───────────────────────────────────────────────────────── -->
  <main id="map-container">
    <div id="map"></div>

    <!-- ── TIMELINE ─────────────────────────────────────────────────── -->
    <div id="timeline-bar">
      <button id="play-btn" title="Play / Pausa">
        <svg id="icon-play"  viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
      </button>

      <div id="time-display">00:00</div>

      <div id="scrubber-wrap">
        <input type="range" id="scrubber" min="0" max="86400" value="0" step="60" />
        <div id="timeline-hours"></div>
      </div>

      <div id="speed-btns">
        <button class="speed-btn active" data-speed="300">300×</button>
        <button class="speed-btn" data-speed="600">600×</button>
        <button class="speed-btn" data-speed="1200">1200×</button>
      </div>
    </div>

    <!-- ── LOADING ───────────────────────────────────────────────────── -->
    <div id="loading">
      <div id="loading-spinner"></div>
      <span>Caricamento scenario…</span>
    </div>
  </main>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
